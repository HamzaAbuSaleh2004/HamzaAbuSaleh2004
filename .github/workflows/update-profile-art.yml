name: Update profile art

"on":
  schedule:
    # 06:17 UTC daily -- an off-the-hour minute avoids GitHub's cron congestion.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # Only the light deps -- the portrait pipeline is local-only.
      - run: pip install -r scripts/requirements.txt

      - name: Fetch repo + language stats
        run: python scripts/fetch_stats.py
        env:
          GITHUB_PROFILE_USER: ${{ github.repository_owner }}
          # Only raises the API rate limit; the script reads public data either way.
          GITHUB_TOKEN: ${{ github.token }}

      - run: python scripts/render_stats_svg.py

      # Still generated, though the README currently features the stats card --
      # so the heatmap is ready to swap back in once the graph fills out.
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_PROFILE_USER: ${{ github.repository_owner }}

      - run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile stats [skip ci]"
          file_pattern: "data/stats.json stats-card.svg data/contributions.json contrib-heatmap.svg"
